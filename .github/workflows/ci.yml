name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  redteam:
    name: Red-team corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Run attack corpus against the guards
        run: |
          uv run aegis redteam --format junit --output reports/redteam.xml
          uv run aegis redteam --format markdown --output reports/redteam.md
      - name: Publish report to the job summary
        if: always()
        run: cat reports/redteam.md >> "$GITHUB_STEP_SUMMARY"
      - name: Scan the example MCP server definitions
        run: |
          uv run aegis scan lab/clean_server_tools.json
          if uv run aegis scan lab/poisoned_server_tools.json; then
            echo "poisoned fixture was not detected" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-report
          path: reports/

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx pip-audit --requirement requirements.txt --disable-pip

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --tag aegis-mcp:ci .
      - name: Smoke test the image in lab mode
        run: |
          docker run --detach --name aegis --publish 8080:8080 --env AEGIS_LAB_MODE=1 aegis-mcp:ci
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs aegis
          exit 1
