repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: aegis-redteam
        name: aegis red-team corpus
        entry: uv run aegis redteam --format json --output reports/redteam.json
        language: system
        pass_filenames: false
        files: ^src/aegis/
