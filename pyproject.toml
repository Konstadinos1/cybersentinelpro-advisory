[project]
name = "aegis-mcp"
version = "0.1.0"
description = "Zero-trust security proxy, runtime guardrail engine and CI red-team suite for MCP and agentic AI applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Konstadinos" }]
keywords = ["mcp", "llm-security", "ai-security", "owasp", "guardrails", "zero-trust"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyjwt>=2.9",
    "sqlglot>=25.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
    "uvicorn>=0.32",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://aegis-mcp-steel.vercel.app"
Repository = "https://github.com/Konstadinos1/aegis-mcp"
Documentation = "https://github.com/Konstadinos1/aegis-mcp/blob/main/docs/usage.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.vercel]
# The public demo site. See main.py and docs/deployment.md.
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=aegis --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlglot.*"]
ignore_missing_imports = true
